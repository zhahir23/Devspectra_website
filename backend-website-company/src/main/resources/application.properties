spring.application.name=devspectra-backend

# Konfigurasi Koneksi Neon Cloud PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-round-union-b5hvwumy-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DATABASE_PASSWORD}

# Konfigurasi Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port Server Backend
server.port=8081